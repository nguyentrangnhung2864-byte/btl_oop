<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lập Lịch Trình | Sổ Tay Lịch Trình Việt Nam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/itinerary.css">
</head>
<body>
<div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="app-main">
        <header class="hero">
            <div class="container sch-hero-split">
                <h1>Lập lịch trình</h1>
                <div class="sch-overview">
                    <div class="sch-ov-title">Tổng quan chuyến đi</div>
                    <div class="sch-ov-stats">
                        <div><strong id="schOvDays">0</strong> ngày</div>
                        <div><strong id="schOvPlaces">0</strong> địa điểm</div>
                    </div>
                    <label class="sch-start">
                        <span>Khởi hành</span>
                        <input type="date" id="schStartDate">
                    </label>
                </div>
            </div>
        </header>

        <main class="container">
            <div id="schMessage" class="sch-message" hidden></div>

            <div class="sch-tabsbar">
                <div id="schTabs" class="sch-tabs"></div>
                <div class="sch-topbtns">
                    <button type="button" id="schSave" class="sch-ghost">💾 Lưu</button>
                    <button type="button" id="schOpenAi" class="sch-ai">✨ Gợi ý lịch trình</button>
                </div>
            </div>
            <p id="schEditingNote" class="sch-hint" hidden></p>
            <p id="schMoveHint" class="sch-hint" hidden>Kéo các ngày để đổi vị trí, bấm "Xong" khi hoàn tất.</p>
            <section id="schDaySection" hidden>
                <div class="sch-toolbar">
                    <h2 id="schDayTitle"></h2>
                    <button type="button" id="schUndo" class="sch-ghost sch-icon-btn" disabled title="Hoàn tác" aria-label="Hoàn tác">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
                    </button>
                </div>

                <div class="sch-layout">
                    <div class="sch-left">
                        <div id="schConflictBanner" class="sch-conflict-banner" hidden></div>
                        <p id="schStatus" class="sch-status"></p>
                        <ul id="schList" class="sch-list"></ul>
                        <button type="button" id="schOpenForm" class="sch-add-item"
                                title="Thêm địa điểm" aria-label="Thêm địa điểm">+</button>
                    </div>

                    <aside class="sch-side">
                        <div class="sch-panel">
                            <h4 class="sch-side-title">Lịch trình trong ngày</h4>
                            <div id="schTimeline" class="sch-timeline"></div>
                        </div>
                        <div id="schDayInfo" class="sch-dayinfo"></div>
                    </aside>
                </div>
            </section>

            <p id="schEmptyDays" class="sch-status" hidden>Chưa có ngày nào. Bấm dấu + để thêm ngày.</p>
        </main>
    </div>
</div>

<!-- Menu khi nhấn giữ một ngày -->
<div id="schMenu" class="sch-menu" hidden>
    <button type="button" id="schMenuMove">↔ Di chuyển</button>
    <button type="button" id="schMenuDelete" class="danger">🗑 Xóa ngày</button>
</div>

<!-- Bảng thêm / chỉnh sửa địa điểm -->
<dialog id="schDialog" class="sch-dialog">
    <form id="schForm" class="sch-form">
        <h3 id="schFormTitle">Thêm địa điểm</h3>
        <label class="sch-field">
            <span>Địa điểm</span>
            <select id="schPlace" required></select>
        </label>
        <div class="sch-row">
            <div class="sch-field">
                <span>Giờ bắt đầu (0-24h)</span>
                <div class="sch-wheels">
                    <div id="schHour" class="sch-wheel"></div>
                    <span class="sch-colon">:</span>
                    <div id="schMinute" class="sch-wheel"></div>
                    <div class="sch-wheel-mark"></div>
                </div>
            </div>
            <label class="sch-field">
                <span>Thời lượng (giờ)</span>
                <input type="number" id="schDuration" min="0.5" step="0.5" value="1" required>
            </label>
        </div>
        <label class="sch-field">
            <span>Ghi chú</span>
            <textarea id="schNote" rows="3" maxlength="500" placeholder="Ví dụ: mang áo mưa, đã đặt vé..."></textarea>
        </label>
        <p id="schFormError" class="sch-form-error" hidden></p>
        <div class="sch-form-actions">
            <button type="button" id="schCancel" class="sch-ghost">Hủy</button>
            <button type="submit" id="schSubmit" class="sch-btn">Thêm</button>
        </div>
    </form>
</dialog>
<!-- Bảng chi tiết địa điểm -->
<dialog id="schDetail" class="sch-dialog">
    <div class="sch-form">
        <div id="schDetailBody"></div>
        <div class="sch-form-actions">
            <button type="button" id="schDetailClose" class="sch-ghost">Đóng</button>
        </div>
    </div>
</dialog>
<!-- Bảng gợi ý lịch trình bằng AI -->
<dialog id="schAiDialog" class="sch-dialog sch-dialog-wide">
    <div class="sch-form">
        <h3>✨ Gợi ý lịch trình</h3>
        <div class="sch-row">
            <div class="sch-field">
                <span>Địa điểm</span>
                <div id="schAiPick" class="sch-pick">
                    <button type="button" id="schAiPickBtn" class="sch-pick-btn"></button>
                    <div id="schAiPickPanel" class="sch-pick-panel" hidden></div>
                </div>
            </div>
            <label class="sch-field">
                <span>Số ngày (1-5)</span>
                <input type="number" id="schAiDays" min="1" max="5" value="2">
            </label>
        </div>
        <label class="sch-field">
            <span>Mong muốn (không bắt buộc)</span>
            <textarea id="schAiPrefs" rows="2" maxlength="300" placeholder="Ví dụ: thích ẩm thực, đi nhẹ nhàng, có trẻ nhỏ..."></textarea>
        </label>
        <p id="schAiStatus" class="sch-status"></p>
        <div id="schAiResult" class="sch-ai-result"></div>
        <div class="sch-form-actions">
            <button type="button" id="schAiClose" class="sch-ghost">Đóng</button>
            <button type="button" id="schAiGenerate" class="sch-btn">Tạo gợi ý</button>
            <button type="button" id="schAiApply" class="sch-btn" hidden>Áp dụng</button>
        </div>
    </div>
</dialog>
<!-- Bảng lưu lịch trình -->
<dialog id="schSaveDialog" class="sch-dialog">
    <div class="sch-form">
        <h3 id="schSaveTitle">Lưu lịch trình</h3>
        <p id="schSaveHint" class="sch-hint" style="margin:0" hidden></p>
        <label class="sch-field">
            <span>Tên lịch trình</span>
            <input type="text" id="schSaveName" maxlength="100" placeholder="Ví dụ: Chuyến Hà Nội 3 ngày">
        </label>
        <p id="schSaveError" class="sch-form-error" hidden></p>
        <div class="sch-form-actions">
            <button type="button" id="schSaveCancel" class="sch-ghost">Hủy</button>
            <button type="button" id="schSaveAsNew" class="sch-ghost" hidden>Lưu thành bản mới</button>
            <button type="button" id="schSaveConfirm" class="sch-btn">Lưu</button>
        </div>
    </div>
</dialog>
<!-- Menu chọn phương tiện giữa hai địa điểm -->
<div id="schTransportMenu" class="sch-menu sch-transport-menu" hidden>
    <div id="schTransportInfo" class="sch-transport-info"></div>
    <div id="schTransportOptions"></div>
</div>
<script type="module" src="/js/layout.js"></script>
<script src="/js/itinerary.js"></script>
</body>
</html>
