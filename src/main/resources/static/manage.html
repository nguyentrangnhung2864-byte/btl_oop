<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý địa điểm | Sổ Tay Lịch Trình Việt Nam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/manage.css">
</head>
<body>
<div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="app-main">
        <div class="page">
            <h1 class="page-title">Quản lý địa điểm</h1>
            <p class="page-desc">Thêm, sửa hoặc xóa địa điểm trong hệ thống.</p>

            <p id="notice" class="notice" hidden></p>

            <div class="manage-toolbar">
                <input type="text" id="search" placeholder="Tìm theo tên địa điểm...">
                <button id="add-btn" class="btn-primary" type="button">+ Thêm địa điểm</button>
            </div>

            <p id="list-status" class="muted"></p>
            <p id="list-error" class="error" hidden></p>

            <div class="table-wrap">
                <table class="place-table">
                    <thead>
                    <tr>
                        <th>Tên địa điểm</th>
                        <th>Tỉnh/Thành phố</th>
                        <th>Khu vực</th>
                        <th>Loại hình</th>
                        <th>Tọa độ</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="place-rows"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Cửa sổ thêm / sửa -->
<div id="form-backdrop" class="modal-backdrop" hidden>
    <div class="modal form-modal">
        <button id="form-close" class="close" type="button">×</button>
        <form id="place-form" class="modal-body" novalidate>
            <h2 id="form-title">Thêm địa điểm</h2>
            <p id="form-error" class="error" hidden></p>

            <div class="form-field">
                <label for="f-name">Tên địa điểm *</label>
                <input id="f-name" type="text" maxlength="255" autocomplete="off">
                <span class="field-error" data-for="name"></span>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label for="f-city">Tỉnh/Thành phố *</label>
                    <input id="f-city" type="text" maxlength="255" autocomplete="off">
                    <span class="field-error" data-for="city"></span>
                </div>
                <div class="form-field">
                    <label for="f-region">Khu vực *</label>
                    <select id="f-region">
                        <option value="">Chọn khu vực</option>
                        <option value="Miền Bắc">Miền Bắc</option>
                        <option value="Miền Trung">Miền Trung</option>
                        <option value="Miền Nam">Miền Nam</option>
                    </select>
                    <span class="field-error" data-for="region"></span>
                </div>
            </div>

            <div class="form-field">
                <label for="f-category">Loại hình *</label>
                <input id="f-category" type="text" maxlength="255" list="category-list" autocomplete="off">
                <datalist id="category-list"></datalist>
                <span class="field-error" data-for="category"></span>
            </div>

            <div class="form-field">
                <label for="f-teaser">Mô tả ngắn</label>
                <textarea id="f-teaser" rows="3" maxlength="500"></textarea>
                <span class="field-error" data-for="teaser"></span>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label for="f-latitude">Vĩ độ</label>
                    <input id="f-latitude" type="number" step="any" placeholder="Ví dụ 21.0285">
                </div>
                <div class="form-field">
                    <label for="f-longitude">Kinh độ</label>
                    <input id="f-longitude" type="number" step="any" placeholder="Ví dụ 105.8522">
                </div>
            </div>

            <div class="form-actions">
                <button id="cancel-btn" class="btn-small" type="button">Hủy</button>
                <button id="save-btn" class="btn-primary" type="submit">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/manage.js"></script>
</body>
</html>
